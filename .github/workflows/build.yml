name: Build

# Every push / PR: build Release x86 and package the zips (downloadable from the run).
# Pushing a tag like v1.0.0: also publish a GitHub Release with the zips attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # VS 2022 (v143); the repo's Directory.Build.props switches the v145 submodules to v143.
    runs-on: windows-2022
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NoelCav-BPR-Mods
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip).FullName --title "${{ github.ref_name }}" --generate-notes
